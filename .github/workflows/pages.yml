name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Fills in missing venues and the merged venue labels (EMNLP, ACL Findings, …) for newly added papers.
      - name: Normalise paper venues
        run: python3 tools/venues.py
      # Builds every page from templates/ and data/, and fails on broken links or unfilled placeholders.
      - name: Build site
        run: python3 tools/build.py --out _site

      # The map reads the CARTO key at runtime from data/runtime.json; it never lives in the repository.
      - name: Add CARTO Basemaps key
        env:
          CARTO_BASEMAPS_KEY: ${{ secrets.CARTO_BASEMAPS_KEY }}
        run: |
          if [ -z "$CARTO_BASEMAPS_KEY" ]; then
            echo "::warning::CARTO_BASEMAPS_KEY secret is not set; maps fall back to OpenStreetMap tiles."
          fi
          python3 -c 'import json, os; json.dump({"carto_basemaps_key": os.environ.get("CARTO_BASEMAPS_KEY", "")}, open("_site/data/runtime.json", "w"))'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
